<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Tarefas Ágeis - TechFlow</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { background-color: #f8f9fa; }
        .card-container { background: #ffffff; border-radius: 8px; box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1); }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="p-4 mb-4 card-container">
            <h1 class="mb-2">📋 TechFlow Solutions</h1>
            <p class="text-muted">Painel de Gerenciamento de Tarefas Ágeis - Visão Geral do Projeto</p>
            <hr>

            <form action="/adicionar" method="POST" class="row g-3 my-3">
                <div class="col-md-9">
                    <input type="text" name="titulo" class="form-control form-control-lg" placeholder="Digite uma nova tarefa para a equipe..." required>
                </div>
                <div class="col-md-3 d-grid">
                    <button type="submit" class="btn btn-primary btn-lg">Adicionar Tarefa</button>
                </div>
            </form>
        </div>

        <div class="p-4 card-container">
            <h3 class="mb-3">Lista de Atividades (Backlog)</h3>
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th scope="col" style="width: 10%;">ID</th>
                            <th scope="col" style="width: 50%;">Descrição da Tarefa</th>
                            <th scope="col" style="width: 25%;">Status (Kanban)</th>
                            <th scope="col" style="width: 15%; text-align: center;">Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for tarefa in tarefas %}
                        <tr>
                            <td><strong>#{{ tarefa.id }}</strong></td>
                            <td>{{ tarefa.titulo }}</td>
                            <td>
                                <form action="/atualizar/{{ tarefa.id }}" method="POST" class="m-0">
                                    <select name="status" onchange="this.form.submit()" class="form-select form-select-sm">
                                        <option value="A Fazer" {% if tarefa.status == 'A Fazer' %}selected{% endif %}>🔴 A Fazer</option>
                                        <option value="Em Progresso" {% if tarefa.status == 'Em Progresso' %}selected{% endif %}>🟡 Em Progresso</option>
                                        <option value="Concluído" {% if tarefa.status == 'Concluído' %}selected{% endif %}>🟢 Concluído</option>
                                    </select>
                                </form>
                            </td>
                            <td class="text-center">
                                <a href="/deletar/{{ tarefa.id }}" class="btn btn-danger btn-sm">Excluir</a>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
